name: lab-checks
on: [push, pull_request]
jobs:
  windows-powershell-5-1:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: choco install ffmpeg -y --no-progress
      - name: Lab tests in Windows PowerShell 5.1
        shell: powershell
        run: ./tests/Invoke-LabTests.ps1
  powershell-7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Lab tests in PowerShell 7
        shell: pwsh
        run: ./tests/Invoke-LabTests.ps1
